services:
  - type: web
    name: ledgerlens-rag
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build

    startCommand: |
      uvicorn backend.main:app --host 0.0.0.0 --port 10000

    envVars:
      - key: PYTHON_VERSION
        value: 3.11

      - key: GROQ_API_KEY
        sync: false

      - key: PINECONE_API_KEY
        sync: false

      - key: PINECONE_ENV
        sync: false

      - key: INDEX_NAME
        sync: false
